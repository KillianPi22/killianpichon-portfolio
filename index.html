<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="Portfolio of Killian Pichon, creating immersive experiences through real-time graphics, technical art and visual storytelling.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://killianpichon.art/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Killian Pichon">
  <meta property="og:title" content="Killian Pichon — Immersive Experiences & Technical Art">
  <meta property="og:description" content="Immersive experiences shaped through real-time graphics, technical art, visual storytelling and production thinking.">
  <meta property="og:url" content="https://killianpichon.art/">
  <meta name="twitter:card" content="summary">
  <title>Killian Pichon — Immersive Experiences & Technical Art</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--font-display:'Archivo',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace}

:root{
--void-950:#0a0a0b;--void-900:#0e0e10;--void-850:#131316;--void-800:#19191d;--void-700:#232328;--void-600:#313138;
--line-subtle:rgba(255,255,255,.07);--line-default:rgba(255,255,255,.13);--line-strong:rgba(255,255,255,.22);
--white-100:#f5f4f0;--white-80:#c9c8c4;--grey-500:#9a999f;--grey-600:#77767c;--grey-700:#57565c;
--ember-500:#ff5a2a;--ember-600:#e8481e;--ember-400:#ff8259;--ember-dim:#3a2016;--ember-glow:rgba(255,90,42,.35);
--surface-page:var(--void-950);--surface-1:var(--void-900);--surface-2:var(--void-850);--surface-3:var(--void-800);--surface-raised:var(--void-700);
--border-color:var(--line-subtle);--border-color-strong:var(--line-default);
--text-heading:var(--white-100);--color-text-body:var(--white-80);--text-muted:var(--grey-500);--text-faint:var(--grey-700);
--accent:var(--ember-500);--accent-hover:var(--ember-400);--accent-dim:var(--ember-dim);--accent-glow:var(--ember-glow);
--focus-ring:rgba(255,90,42,.55)
}

:root{
--text-display-xl:clamp(3.4rem,calc(6vw + 1rem),6.8rem);--text-display-lg:clamp(2.4rem,calc(4vw + 1rem),4.2rem);--text-display-md:clamp(1.8rem,calc(2.4vw + 1rem),2.6rem);
--text-h1:clamp(1.6rem,calc(1.6vw + 1rem),2.1rem);--text-h2:1.5rem;--text-h3:1.125rem;
--color-text-body-lg:1.0625rem;--font-size-body:.9375rem;--text-small:.8125rem;--text-micro:.6875rem;
--leading-tight:1.02;--leading-snug:1.2;--leading-normal:1.55;--leading-relaxed:1.7;
--tracking-tight:-0.02em;--tracking-normal:0;--tracking-wide:.1em;--tracking-widest:.18em;
--weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;--weight-black:800
}

:root{
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;--space-10:128px;--space-11:160px;--space-12:200px;
--container-max:1440px;--container-pad:clamp(20px,4vw,64px);--grid-columns:12;/* @kind other */--grid-gap:24px
}

:root{
--radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pill:999px;
--shadow-soft:0 1px 0 rgba(255,255,255,.03) inset,0 12px 40px rgba(0,0,0,.35);
--shadow-glow:0 0 48px var(--accent-glow);
--blur-panel:blur(16px);/* @kind other */
--ease-out:cubic-bezier(.16,1,.3,1);/* @kind other */--ease-in-out:cubic-bezier(.65,0,.35,1);/* @kind other */
--duration-fast:150ms;/* @kind other */--duration-base:320ms;/* @kind other */--duration-slow:640ms/* @kind other */
}






*{box-sizing:border-box}
html{background:var(--surface-page);overflow-x:hidden;scroll-behavior:smooth}
body{margin:0;background:var(--surface-page);color:var(--color-text-body);font-family:var(--font-body);font-size:var(--font-size-body);line-height:var(--leading-normal);overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);color:var(--text-heading);margin:0;letter-spacing:var(--tracking-tight)}
a{color:var(--text-heading);text-decoration:none}
a:hover{color:var(--accent-hover)}
button,input,select,textarea{font:inherit}
button{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
::selection{background:var(--accent);color:var(--void-950)}

.site-nav{position:relative;z-index:30}
.site-mark{display:inline-flex;align-items:center;min-height:32px}
.view-all-button,.project-back,.related-project-button{appearance:none;background:none;border:0;padding:0}
.view-all-button{font-size:var(--text-small);color:var(--text-muted);text-transform:uppercase;letter-spacing:var(--tracking-wide);cursor:pointer}
.view-all-button:hover{color:var(--text-heading)}
.project-media-tile{appearance:none;width:100%;padding:0;text-align:inherit}
.modal-backdrop{overscroll-behavior:contain}

@media (max-width: 1024px){
  .project-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .project-hero-grid{grid-template-columns:minmax(260px,340px) 1fr!important;gap:var(--space-6)!important}
}

@media (max-width: 767px){
  .site-nav{padding:20px var(--container-pad)!important;gap:10px}
  .site-nav-links{gap:10px!important;min-width:0}
  .site-nav-link{font-size:10px!important;letter-spacing:.12em!important;white-space:nowrap}
  .site-mark{font-size:16px!important;flex:0 0 auto}

  .hero{padding:108px var(--container-pad) 0!important;min-height:0!important}
  .hero-main{display:block!important}
  .hero-left{width:100%!important}
  .hero-title-wrap h1{font-size:clamp(3rem,16vw,4.6rem)!important}
  .hero-art{display:none!important}
  .hero-scroll-indicator{display:none!important}
  .hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin-top:var(--space-7)}
  .hero-stat{padding:var(--space-5) var(--space-3)!important}
  .hero-reel{width:min(280px,100%)!important}

  .featured-projects{padding:72px var(--container-pad)!important}
  .section-heading{align-items:flex-start!important;gap:16px}
  .section-heading h2{font-size:1.45rem!important}
  .project-grid{grid-template-columns:1fr!important}
  .clients-section,.awards-section{padding-left:var(--container-pad)!important;padding-right:var(--container-pad)!important}

  .contact-layout{grid-template-columns:1fr!important;gap:var(--space-7)!important;padding:48px var(--container-pad) 80px!important}
  .contact-form{max-width:none!important;width:100%}
  .contact-name-email{grid-template-columns:1fr!important;gap:0!important}

  .project-page-container{padding:0 var(--container-pad)!important}
  .project-hero-grid{grid-template-columns:1fr!important;gap:var(--space-6)!important}
  .project-summary{min-width:0}
  .project-media-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-rows:140px!important;min-height:0!important}
  .project-media-tile{grid-row:auto!important;min-height:140px}
  .project-details-grid{grid-template-columns:1fr!important;gap:var(--space-5)!important;margin-top:var(--space-7)!important}
  .project-nav-edge{top:50%!important;top:50dvh!important;bottom:auto!important;transform:translateY(-50%)!important}
  .project-nav-edge-prev{left:12px!important}
  .project-nav-edge-next{right:12px!important}
  .project-nav-edge .pn-label{display:none!important}
  .project-nav-button{width:44px!important;height:44px!important}
  .modal-backdrop{padding:20px!important}
}

@media (hover: none){
  .project-nav-edge{top:50%!important;top:50dvh!important;bottom:auto!important;transform:translateY(-50%)!important}
  .project-nav-edge-prev{left:12px!important}
  .project-nav-edge-next{right:12px!important}
  .project-nav-edge .pn-label{display:none!important}
  .project-nav-button{width:44px!important;height:44px!important}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>

  <div id="offline-fallback">
    <main style="min-height:100vh;padding:clamp(32px,7vw,96px);background:#0a0a0b;color:#f3f1ed;font-family:Arial,sans-serif">
      <p style="margin:0 0 24px;color:#ff8259;letter-spacing:.24em;font-size:12px">IMMERSIVE EXPERIENCES · TECHNICAL ART</p>
      <h1 style="margin:0;font-size:clamp(64px,12vw,168px);line-height:.86;letter-spacing:-.06em">KILLIAN<br>PICHON</h1>
      <p style="max-width:480px;margin:40px 0 0;font-size:18px;line-height:1.6;color:#c8c5c0">Real-time, VFX, motion design and immersive experiences.</p>
    </main>
  </div>
  <div id="root"></div>
